        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
        }
        h1 { border-bottom: 1px solid #333; padding-bottom: 10px; }
        .panel {
            background: #1e1e1e;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        textarea {
            width: 100%; height: 150px; background: #2d2d2d; color: #fff;
            border: 1px solid #444; border-radius: 4px; padding: 10px;
            font-family: monospace; box-sizing: border-box; resize: vertical;
        }
        .controls {
            display: flex; gap: 20px; align-items: center; margin-top: 15px; flex-wrap: wrap;
        }
        .input-group { display: flex; flex-direction: column; gap: 5px; }
        input[type="number"], input[type="text"] {
            background: #2d2d2d; color: #fff; border: 1px solid #444;
            padding: 8px; border-radius: 4px;
        }
        button {
            background: #4CAF50; color: white; border: none; padding: 10px 20px;
            border-radius: 4px; cursor: pointer; font-size: 16px; font-weight: bold;
            transition: background 0.2s;
        }
        button:hover:not(:disabled) { background: #45a049; }
        button:disabled { background: #555; cursor: not-allowed; color: #888; }
        
        .action-buttons { display: flex; gap: 10px; }
        button.secondary { background: #2196F3; font-size: 14px; padding: 8px 16px;}
        button.secondary:hover:not(:disabled) { background: #1976d2; }
        button.primary { background: #E91E63; font-size: 14px; padding: 8px 16px;}
        button.primary:hover:not(:disabled) { background: #C2185B; }
        
        /* Progress Bar */
        #progress-container { display: none; margin-top: 20px; }
        .progress-track {
            width: 100%; background: #333; border-radius: 10px; overflow: hidden; height: 20px;
        }
        #progress-bar {
            height: 100%; background: #4CAF50; width: 0%; transition: width 0.1s linear;
        }
        #status-text { margin-top: 8px; font-size: 14px; color: #aaa; text-align: center; }

        /* Gallery */
        #gallery { display: flex; flex-wrap: wrap; gap: 15px; margin-top: 20px; }
        .frame-preview {
            display: flex; flex-direction: column; align-items: center;
            background: #2d2d2d; padding: 10px; border-radius: 6px; width: 180px;
        }
        .frame-preview img { width: 100%; border-radius: 4px; border: 1px solid #444; }
        .frame-preview span { margin-top: 8px; font-size: 12px; color: #ccc; }
    </style>
</head>

        <div class="controls">
            <div class="input-group">
                <label for="engine-depth">Lozza Depth</label>
                <input type="number" id="engine-depth" value="8" min="1" max="20" style="width: 80px;">
            </div>
            <div class="input-group">
                <label for="black-usernames">Auto-Flip Usernames</label>
                <input type="text" id="black-usernames" value="0fajarpurnama0, fajar purnama" style="width: 250px;">
            </div>
            <div class="input-group" style="justify-content: flex-end;">
                <button id="btn-generate">Generate Frames</button>
            </div>
        </div>

        <div id="progress-container">
            <div class="progress-track"><div id="progress-bar"></div></div>
            <div id="status-text">Ready...</div>
        </div>

    <div class="panel" id="output-panel" style="display: none;">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h2 style="margin: 0;">Generated Export</h2>
            <div class="action-buttons">
                <button id="btn-download-zip" class="secondary">Download ZIP</button>
                <button id="btn-download-video" class="primary">🎥 Render Video (.mp4)</button>
            </div>
        </div>
        <div id="gallery"></div>
    </div>

    <!-- Required Dependencies -->
    <script src="lib/chess-0.12.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    
    <!-- FFmpeg specific script -->
    <script src="lib/ffmpeg-0.11.6.min.js"></script>

    <!-- Our Exporter Modules -->
    <script src="js/exporter/parser.js"></script>
    <script src="js/exporter/evaluator.js"></script>
    <script src="js/exporter/renderer.js"></script>
    <script src="js/exporter/pipeline.js"></script>

    <!-- UI Controller Logic -->
    <script>
        const btnGenerate = document.getElementById('btn-generate');
        const btnDownloadZip = document.getElementById('btn-download-zip');
        const btnDownloadVideo = document.getElementById('btn-download-video');
        const pgnInput = document.getElementById('pgn-input');
        
        const progressContainer = document.getElementById('progress-container');
        const progressBar = document.getElementById('progress-bar');
        const statusText = document.getElementById('status-text');
        const outputPanel = document.getElementById('output-panel');
        const gallery = document.getElementById('gallery');

        let generatedData = null;
        
        // Initialize FFmpeg
        const { createFFmpeg, fetchFile } = FFmpeg;
        const ffmpeg = createFFmpeg({ log: true });

        btnGenerate.addEventListener('click', async () => {
            const pgn = pgnInput.value.trim();
            if (!pgn) return alert("Please enter a PGN.");

            const usernames = document.getElementById('black-usernames').value.split(',').map(s => s.trim());
            const depth = parseInt(document.getElementById('engine-depth').value) || 8;

            btnGenerate.disabled = true;
            outputPanel.style.display = 'none';
            gallery.innerHTML = '';
            progressContainer.style.display = 'block';
            
            try {
                generatedData = await window.ChessApp.Exporter.Pipeline.runBatchExport(
                    pgn, { usernames, depth }, (prog) => {
                        progressBar.style.width = prog.percent + '%';
                        progressBar.style.backgroundColor = '#4CAF50';
                        statusText.innerText = `Evaluating and rendering frame ${prog.current} of ${prog.total}...`;
                    }
                );
                statusText.innerText = `Complete! ${generatedData.frames.length} frames generated.`;
                
                generatedData.frames.forEach(f => {
                    const div = document.createElement('div');
                    div.className = 'frame-preview';
                    div.innerHTML = `<img src="${f.dataUrl}"><span>move_${f.frameIndex}.png (${f.duration}s)</span>`;
                    gallery.appendChild(div);
                });
                outputPanel.style.display = 'block';

            } catch (err) {
                console.error(err);
                statusText.innerText = `Error: ${err.message}`;
            } finally {
                btnGenerate.disabled = false;
            }
        });

        // --------------------------------------------------------
        // VIDEO GENERATION LOGIC (Thread-Safe & Crash-Free)
        // --------------------------------------------------------
        btnDownloadVideo.addEventListener('click', async () => {
            if (!generatedData || !generatedData.frames.length) return;
            
            btnDownloadVideo.disabled = true;
            btnDownloadZip.disabled = true;
            btnGenerate.disabled = true;
            progressContainer.style.display = 'block';
            progressBar.style.backgroundColor = '#E91E63'; 
            progressBar.style.width = '0%';
            
            try {
                if (!ffmpeg.isLoaded()) {
                    statusText.innerText = "Loading FFmpeg core...";
                    await ffmpeg.load();
                }

                statusText.innerText = "Writing frames to virtual filesystem...";
                
                let framesTxt = "";
                const writtenFiles = [];
                
                // 1. Write frames to virtual memory
                for (let i = 0; i < generatedData.frames.length; i++) {
                    const f = generatedData.frames[i];
                    const filename = `move_${f.frameIndex}.png`;
                    
                    ffmpeg.FS('writeFile', filename, await fetchFile(f.dataUrl));
                    writtenFiles.push(filename);
                    
                    const duration = (i === generatedData.frames.length - 1) ? 5.00 : f.duration;
                    framesTxt += `file '${filename}'\n`;
                    framesTxt += `duration ${duration.toFixed(2)}\n`;
                }

                const lastIdx = generatedData.frames[generatedData.frames.length - 1].frameIndex;
                framesTxt += `file 'move_${lastIdx}.png'\n`;

                ffmpeg.FS('writeFile', 'frames.txt', new TextEncoder().encode(framesTxt));
                writtenFiles.push('frames.txt');

                // 2. Safe built-in progress tracker (No setLogger)
                ffmpeg.setProgress(({ ratio }) => {
                    if (ratio >= 0 && ratio <= 1) {
                        const percent = Math.round(ratio * 100);
                        progressBar.style.width = percent + '%';
                        statusText.innerText = `Encoding MP4 Video... ${percent}%`;
                    }
                });

                statusText.innerText = "Encoding MP4 Video... 0%";
                
                // 3. Execute FFmpeg with single-threaded safety (-threads 1 prevents WASM pthread crashes)
                await ffmpeg.run(
                    '-f', 'concat',
                    '-safe', '0',
                    '-i', 'frames.txt',
                    '-vsync', 'vfr',          // keep concat timestamps, no duplicate frames
                    '-pix_fmt', 'yuv420p',
                    '-c:v', 'libx264',
                    '-preset', 'ultrafast',
                    '-threads', '1',
                    '-crf', '26',
                    '-g', '1',                // optional: every frame is a keyframe, so seeking is exact
                    '-movflags', '+faststart',
                    'output.mp4'
                );

                statusText.innerText = "Finalizing video download...";

                // 4. Read output and trigger browser download
                const data = ffmpeg.FS('readFile', 'output.mp4');
                const videoBlob = new Blob([data.buffer], { type: 'video/mp4' });
                saveAs(videoBlob, 'chess_analytic_game.mp4');
                
                // 5. Clean up virtual filesystem memory
                writtenFiles.push('output.mp4');
                writtenFiles.forEach(file => {
                    try { ffmpeg.FS('unlink', file); } catch (e) {}
                });

                progressBar.style.width = '100%';
                statusText.innerText = "Video Download Complete!";

            } catch (err) {
                console.error(err);
                try { ffmpeg.exit(); } catch (e) {}   // next click will reload a fresh core
                statusText.innerText = `Video Error: ${err.message}`;
                alert("Failed to generate video. You can still use the Download ZIP option.");
            } finally {
                btnDownloadVideo.disabled = false;
                btnDownloadZip.disabled = false;
                btnGenerate.disabled = false;
            }
        });

        // --------------------------------------------------------
        // ZIP GENERATION LOGIC (Preserved)
        // --------------------------------------------------------
        btnDownloadZip.addEventListener('click', async () => {
            if (!generatedData || !generatedData.frames.length) return;
            
            const zip = new JSZip();
            const folder = zip.folder("analytic_frames");
            let framesTxt = "";

            generatedData.frames.forEach((f, index) => {
                const filename = `move_${f.frameIndex}.png`;
                const base64Data = f.dataUrl.split(',')[1];
                folder.file(filename, base64Data, { base64: true });
                
                const duration = index === generatedData.frames.length - 1 ? 5.00 : f.duration;
                framesTxt += `file '${filename}'\n`;
                framesTxt += `duration ${duration.toFixed(2)}\n`;
            });
            
            const lastFrameIdx = generatedData.frames[generatedData.frames.length - 1].frameIndex;
            framesTxt += `file 'move_${lastFrameIdx}.png'\n`;
            folder.file("frames.txt", framesTxt);

            statusText.innerText = "Zipping files...";
            btnDownloadZip.disabled = true;

            try {
                const blob = await zip.generateAsync({ type: "blob" });
                saveAs(blob, "chess_frames_export.zip");
                statusText.innerText = "Download triggered.";
            } catch (err) {
                console.error(err);
                alert("Failed to generate ZIP.");
            } finally {
                btnDownloadZip.disabled = false;
            }
        });
    </script>
